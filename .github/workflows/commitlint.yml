name: Commitlint

on:
  pull_request:
    branches: [master, main, develop, dev]
  push:
    branches: [master, main, develop, dev]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install commitlint dependencies
        run: |
          npm install --no-save @commitlint/cli@^20.1.0 commitlint-config-gitmoji@^2.3.1

      - name: Create commitlint config
        run: |
          echo "module.exports = { extends: ['gitmoji'] };" > commitlint.config.js

      - name: Validate current commit (push)
        if: github.event_name == 'push'
        run: npx commitlint --from HEAD~1 --to HEAD --verbose

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Validate recent commits (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npx commitlint --from HEAD~5 --to HEAD --verbose

      - name: Add helpful comment on PR failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Commit Message Check Failed

Your commit messages don't follow the required gitmoji format. Please make sure your commits follow this pattern:

\`🎨 feat: add new feature\`
\`🐛 fix: resolve bug issue\`
\`📚 docs: update documentation\`
\`🔧 chore: update dependencies\`

**Required Format:** \`[gitmoji] [type]: [description]\`

📖 **Resources:**
- [Gitmoji Guide](https://gitmoji.dev/) - Find the right emoji for your commit
- [Conventional Commits](https://www.conventionalcommits.org/) - Learn about commit types

🔧 **How to fix:**
1. For the last commit: \`git commit --amend -m "🎨 feat: your description"\`
2. For multiple commits: \`git rebase -i HEAD~n\` (where n is number of commits)
3. Then force push: \`git push --force-with-lease\`

The CI will automatically re-run once you update your commit messages! 🚀`
            })
